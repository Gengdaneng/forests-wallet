<!-- @dsCard group="Motion" viewport="700x170" name="Press & hover" subtitle="Presses shrink; hover darkens by one ramp step. No hue changes." -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:170px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="rw" style="gap:16px">
<div style="text-align:center"><div style="min-width:150px;padding:14px 20px;border-radius:var(--radius-md);background:var(--action-primary);color:var(--action-primary-text);font-family:var(--font-rounded);font-weight:800">静止</div><code class="k">action-primary</code></div>
<div style="text-align:center"><div style="min-width:150px;padding:14px 20px;border-radius:var(--radius-md);background:var(--action-primary-press);color:var(--action-primary-text);font-family:var(--font-rounded);font-weight:800;transform:scale(.97)">按下 · scale .97</div><code class="k">action-primary-press</code></div>
<div style="text-align:center"><div style="min-width:150px;padding:14px 20px;border-radius:var(--radius-md);background:var(--disabled-bg);color:var(--disabled-text);font-family:var(--font-rounded);font-weight:800">不可用</div><code class="k">disabled-bg</code></div>
</div><div class="k" style="margin-top:12px">儿童端按下更明显：--press-scale-child .95</div><script>lucide.createIcons()</script></body></html>
