<!-- @dsCard group="Brand" viewport="700x170" name="Wordmark" subtitle="No logo file exists in the source repo — the name is set in type" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:170px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="rw" style="align-items:stretch;gap:14px">
<div style="flex:1;background:var(--surface-ink);border-radius:var(--radius-xl);padding:22px;display:grid;place-items:center">
<div style="font-family:var(--font-rounded);font-weight:900;font-size:30px;letter-spacing:-.02em;color:var(--honey-500)">Forrest's Wallet</div></div>
<div style="flex:1;background:var(--paper-100);border:1px solid var(--border-card);border-radius:var(--radius-xl);padding:22px;display:grid;place-items:center">
<div style="font-family:var(--font-rounded);font-weight:900;font-size:30px;letter-spacing:-.02em;color:var(--spruce-700)">Forrest's Wallet</div></div>
</div><div class="k" style="margin-top:10px">honey on ink · spruce on paper。绝不自行绘制标志。</div><script>lucide.createIcons()</script></body></html>
