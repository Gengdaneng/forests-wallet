<!-- @dsCard group="Brand" viewport="700x180" name="Icon set · Lucide" subtitle="2px line icons, always paired with a word" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:180px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="sw" style="gap:10px">
<div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="wallet" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">我的钱</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="calendar-check" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">看板</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="scroll-text" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">规则</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="list" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">流水</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="sparkles" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">心愿</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="target" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">目标</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="arrow-down-left" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">加进来</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="arrow-up-right" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">花掉</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="rotate-ccw" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">更正</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="cloud-off" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">离线</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="shield-check" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">只记账</span></div><div style="width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 6px">
<i data-lucide="settings" width="24" height="24" style="color:var(--spruce-700)"></i><span style="font-size:12px;font-weight:600">设置</span></div>
</div><script>lucide.createIcons()</script></body></html>
