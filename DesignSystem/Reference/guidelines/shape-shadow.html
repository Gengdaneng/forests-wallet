<!-- @dsCard group="Shape" viewport="700x180" name="Elevation" subtitle="Paper, not glass: short warm shadows plus a hairline" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:180px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="rw" style="gap:16px">
<div style="flex:1;min-width:130px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-card)">
<div style="font-family:var(--font-rounded);font-weight:700;font-size:15px">家长卡片</div><code class="k" style="display:block;margin-top:6px">shadow-card</code></div><div style="flex:1;min-width:130px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-card-child)">
<div style="font-family:var(--font-rounded);font-weight:700;font-size:15px">儿童卡片</div><code class="k" style="display:block;margin-top:6px">shadow-card-child</code></div><div style="flex:1;min-width:130px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-raised)">
<div style="font-family:var(--font-rounded);font-weight:700;font-size:15px">浮起 / 弹窗</div><code class="k" style="display:block;margin-top:6px">shadow-raised</code></div><div style="flex:1;min-width:130px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-focus)">
<div style="font-family:var(--font-rounded);font-weight:700;font-size:15px">键盘焦点</div><code class="k" style="display:block;margin-top:6px">shadow-focus</code></div>
</div><script>lucide.createIcons()</script></body></html>
