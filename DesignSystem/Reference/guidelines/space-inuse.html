<!-- @dsCard group="Spacing" viewport="700x200" name="Padding in use" subtitle="Child cards breathe at 24px; parent cards work at 16px" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:200px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="rw" style="align-items:stretch;gap:16px">
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-card-child);padding:var(--card-pad-child);box-shadow:var(--shadow-card-child)">
<div class="lb">child · 24px / radius 24</div><div style="font-family:var(--font-rounded);font-weight:800;font-size:22px">乐高赛车</div><div style="margin-top:8px;font-size:17px;color:var(--text-muted)">已攒 ¥87 / ¥400</div></div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-card-parent);padding:var(--card-pad-parent);box-shadow:var(--shadow-card)">
<div class="lb">parent · 16px / radius 16</div><div style="font-family:var(--font-rounded);font-weight:700;font-size:17px">本周基础零花钱</div><div style="margin-top:6px;font-size:13px;color:var(--text-muted)">10月5日 · 已记录</div></div>
</div><script>lucide.createIcons()</script></body></html>
