<!-- @dsCard group="Shape" viewport="700x160" name="Corner radii" subtitle="Child 24, parent 16–20, cells 10, pills for status" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:160px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="rw" style="gap:14px">
<div style="text-align:center"><div style="width:64px;height:64px;background:var(--spruce-700);border-radius:var(--radius-xs)"></div><code class="k" style="display:block;margin-top:6px">xs · 6</code></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--spruce-700);border-radius:var(--radius-sm)"></div><code class="k" style="display:block;margin-top:6px">sm · 10</code></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--spruce-700);border-radius:var(--radius-md)"></div><code class="k" style="display:block;margin-top:6px">md · 16</code></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--spruce-700);border-radius:var(--radius-lg)"></div><code class="k" style="display:block;margin-top:6px">lg · 20</code></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--spruce-700);border-radius:var(--radius-xl)"></div><code class="k" style="display:block;margin-top:6px">xl · 24</code></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--spruce-700);border-radius:var(--radius-2xl)"></div><code class="k" style="display:block;margin-top:6px">2xl · 32</code></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--spruce-700);border-radius:var(--radius-pill)"></div><code class="k" style="display:block;margin-top:6px">pill · 999</code></div>
</div><script>lucide.createIcons()</script></body></html>
