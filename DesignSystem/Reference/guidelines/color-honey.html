<!-- @dsCard group="Colors" viewport="700x130" name="Honey ramp" subtitle="Pocket money, savings goal, the one accent action" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:130px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="sw"><div class="chip" style="background:var(--honey-700);color:#FFFDF7"><b>700</b><code>honey-700</code></div><div class="chip" style="background:var(--honey-600);color:#0E2A24"><b>600</b><code>honey-600</code></div><div class="chip" style="background:var(--honey-500);color:#0E2A24"><b>500</b><code>honey-500</code></div><div class="chip" style="background:var(--honey-300);color:#0E2A24"><b>300</b><code>honey-300</code></div><div class="chip" style="background:var(--honey-100);color:#0E2A24"><b>100</b><code>honey-100</code></div></div><script>lucide.createIcons()</script></body></html>
