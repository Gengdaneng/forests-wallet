<!-- @dsCard group="Type" viewport="700x210" name="Families" subtitle="Rounded for headings & numbers, text for prose, mono for ledger columns" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:210px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div style="display:grid;gap:14px">
<div><div class="lb">--font-rounded · ui-rounded / SF Pro Rounded → Nunito</div><div style="font-family:var(--font-rounded);font-weight:800;font-size:26px">你现在有 87 元 · 0123456789</div></div>
<div><div class="lb">--font-text · SF Pro Text / 苹方 → Noto Sans SC</div><div style="font-size:19px">记错了就记一笔更正，原来那条不会消失。</div></div>
<div><div class="lb">--font-mono · 流水对齐用</div><div style="font-family:var(--font-mono);font-size:16px">剩 ¥87 &nbsp; 剩 ¥72 &nbsp; 剩 ¥100</div></div>
</div><script>lucide.createIcons()</script></body></html>
