<!-- @dsCard group="Shape" viewport="700x190" name="Card anatomy" subtitle="Five grounds, one shape language" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:190px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="rw" style="align-items:stretch;gap:12px">
<div style="flex:1;background:var(--surface-card);color:var(--text-strong);border:1px solid var(--border-card);border-radius:var(--radius-xl);padding:16px;min-height:110px;box-shadow:var(--shadow-card)">
<div style="font-family:var(--font-rounded);font-weight:800;font-size:15px">paper</div>
<div style="margin-top:8px;font-size:12px;opacity:.75">默认容器</div></div><div style="flex:1;background:var(--surface-sunken);color:var(--text-body);border:none;border-radius:var(--radius-xl);padding:16px;min-height:110px;box-shadow:none">
<div style="font-family:var(--font-rounded);font-weight:800;font-size:15px">sunken</div>
<div style="margin-top:8px;font-size:12px;opacity:.75">凹陷分组</div></div><div style="flex:1;background:var(--surface-leaf);color:var(--spruce-800);border:none;border-radius:var(--radius-xl);padding:16px;min-height:110px;box-shadow:var(--shadow-card)">
<div style="font-family:var(--font-rounded);font-weight:800;font-size:15px">leaf</div>
<div style="margin-top:8px;font-size:12px;opacity:.75">收入 / 规则</div></div><div style="flex:1;background:var(--surface-honey);color:var(--text-on-honey);border:none;border-radius:var(--radius-xl);padding:16px;min-height:110px;box-shadow:var(--shadow-card)">
<div style="font-family:var(--font-rounded);font-weight:800;font-size:15px">honey</div>
<div style="margin-top:8px;font-size:12px;opacity:.75">零花钱 / 目标</div></div><div style="flex:1;background:var(--surface-ink);color:var(--text-on-ink);border:none;border-radius:var(--radius-xl);padding:16px;min-height:110px;box-shadow:var(--shadow-card)">
<div style="font-family:var(--font-rounded);font-weight:800;font-size:15px">ink</div>
<div style="margin-top:8px;font-size:12px;opacity:.75">余额</div></div>
</div><script>lucide.createIcons()</script></body></html>
