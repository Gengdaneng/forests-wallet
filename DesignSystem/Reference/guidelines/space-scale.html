<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:160px;box-sizing:border-box}

.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>

uce-700);border-radius:2px;margin:0 auto"></div><code class="k" style="display:block;margin-top:6px">9</code></div><div style="text-align:center"><div style="width:var(--space-10);height:var(--space-10);min-width:2px;background:var(--spruce-700);border-radius:2px;margin:0 auto"></div><code class="k" style="display:block;margin-top:6px">10</code></div><div style="text-align:center"><div style="width:var(--space-11);height:var(--space-11);min-width:2px;background:var(--spruce-700);border-radius:2px;margin:0 auto"></div><code class="k" style="display:block;margin-top:6px">11</code></div><div style="text-align:center"><div style="width:var(--space-12);height:var(--space-12);min-width:2px;background:var(--spruce-700);border-radius:2px;margin:0 auto"></div><code class="k" style="display:block;margin-top:6px">12</code></div>
