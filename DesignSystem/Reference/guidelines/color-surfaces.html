<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces & text" subtitle="Legal text colours on each ground" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:160px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="sw" style="gap:12px">
<div style="flex:1;min-width:120px;background:var(--surface-app);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border-card)">
<div style="color:var(--text-body);font-family:var(--font-rounded);font-weight:800;font-size:14px">纸白底 · --text-body</div>
<div style="color:var(--text-muted);font-size:12px;margin-top:6px">次要文字</div></div><div style="flex:1;min-width:120px;background:var(--surface-card);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border-card)">
<div style="color:var(--text-strong);font-family:var(--font-rounded);font-weight:800;font-size:14px">卡片 · --text-strong</div>
<div style="color:var(--text-muted);font-size:12px;margin-top:6px">次要文字</div></div><div style="flex:1;min-width:120px;background:var(--surface-leaf);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border-card)">
<div style="color:var(--spruce-800);font-family:var(--font-rounded);font-weight:800;font-size:14px">新叶 · --spruce-800</div>
<div style="color:var(--spruce-600);font-size:12px;margin-top:6px">次要文字</div></div><div style="flex:1;min-width:120px;background:var(--surface-honey);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border-card)">
<div style="color:var(--text-on-honey);font-family:var(--font-rounded);font-weight:800;font-size:14px">暖黄 · --text-on-honey</div>
<div style="color:var(--honey-700);font-size:12px;margin-top:6px">次要文字</div></div><div style="flex:1;min-width:120px;background:var(--surface-ink);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border-card)">
<div style="color:var(--text-on-ink);font-family:var(--font-rounded);font-weight:800;font-size:14px">墨绿 · --text-on-ink</div>
<div style="color:var(--text-on-ink-muted);font-size:12px;margin-top:6px">次要文字</div></div>
</div><script>lucide.createIcons()</script></body></html>
