<!-- @dsCard group="Type" viewport="700x180" name="Ledger figures" subtitle="Tabular numerals + running balance so he can check the arithmetic" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:180px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div style="background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:12px 16px;display:grid;gap:8px">
<div style="display:flex;align-items:baseline;gap:12px"><span style="flex:1;font-family:var(--font-rounded);font-weight:700;font-size:17px">本周基础零花钱</span>
<span style="font-family:var(--font-rounded);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--money-in)">+¥10</span>
<span style="font-family:var(--font-mono);font-size:12px;color:var(--text-faint);width:64px;text-align:right">剩 ¥87</span></div><div style="display:flex;align-items:baseline;gap:12px"><span style="flex:1;font-family:var(--font-rounded);font-weight:700;font-size:17px">买冰淇淋</span>
<span style="font-family:var(--font-rounded);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--money-out)">−¥15</span>
<span style="font-family:var(--font-mono);font-size:12px;color:var(--text-faint);width:64px;text-align:right">剩 ¥77</span></div><div style="display:flex;align-items:baseline;gap:12px"><span style="flex:1;font-family:var(--font-rounded);font-weight:700;font-size:17px">更正：记错了</span>
<span style="font-family:var(--font-rounded);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--money-fix)">±¥3</span>
<span style="font-family:var(--font-mono);font-size:12px;color:var(--text-faint);width:64px;text-align:right">剩 ¥92</span></div>
</div><script>lucide.createIcons()</script></body></html>
