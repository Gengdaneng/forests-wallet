<!-- @dsCard group="Colors" viewport="700x150" name="Brand core" subtitle="The four colours named in the PRD — everything else is derived" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:150px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="sw" style="gap:12px">
<div class="chip" style="background:var(--spruce-700);color:var(--paper-100);min-width:150px;padding:16px"><b>云杉墨绿</b><code>#173D35 · --spruce-700</code></div>
<div class="chip" style="background:var(--leaf-200);color:var(--spruce-800);min-width:150px;padding:16px"><b>新叶绿</b><code>#D8EDD5 · --leaf-200</code></div>
<div class="chip" style="background:var(--honey-500);color:var(--spruce-800);min-width:150px;padding:16px"><b>零花钱暖黄</b><code>#F3C968 · --honey-500</code></div>
<div class="chip" style="background:var(--paper-100);color:var(--spruce-800);min-width:150px;padding:16px;border:1px solid var(--border-card)"><b>手账纸白</b><code>#FBF7ED · --paper-100</code></div>
</div><script>lucide.createIcons()</script></body></html>
