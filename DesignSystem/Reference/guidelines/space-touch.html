<!-- @dsCard group="Spacing" viewport="700x170" name="Touch targets" subtitle="44px floor, 48px on iPhone, 54px on Forrest's iPad" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:16px 20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-text);min-height:170px;box-sizing:border-box}
.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-sm);padding:10px 12px;min-width:96px;font-family:var(--font-rounded);font-weight:700;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:13px}.chip code{font-family:var(--font-mono);font-size:10px;opacity:.8;font-weight:400}
.k{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.lb{font-family:var(--font-rounded);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.rw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}</style></head>
<body><div class="rw" style="gap:18px">
<div style="text-align:center"><div style="width:var(--touch-min);height:var(--touch-min);border-radius:var(--radius-md);background:var(--surface-leaf);border:1.5px solid var(--leaf-500);display:grid;place-items:center;font-family:var(--font-rounded);font-weight:800;color:var(--spruce-700)">44</div>
<div style="margin-top:8px;font-size:13px;font-weight:600">最低底线</div><code class="k">touch-min</code></div><div style="text-align:center"><div style="width:var(--touch-parent);height:var(--touch-parent);border-radius:var(--radius-md);background:var(--surface-leaf);border:1.5px solid var(--leaf-500);display:grid;place-items:center;font-family:var(--font-rounded);font-weight:800;color:var(--spruce-700)">48</div>
<div style="margin-top:8px;font-size:13px;font-weight:600">家长 iPhone</div><code class="k">touch-parent</code></div><div style="text-align:center"><div style="width:var(--touch-child);height:var(--touch-child);border-radius:var(--radius-md);background:var(--surface-leaf);border:1.5px solid var(--leaf-500);display:grid;place-items:center;font-family:var(--font-rounded);font-weight:800;color:var(--spruce-700)">54</div>
<div style="margin-top:8px;font-size:13px;font-weight:600">儿童 iPad</div><code class="k">touch-child</code></div>
</div><script>lucide.createIcons()</script></body></html>
