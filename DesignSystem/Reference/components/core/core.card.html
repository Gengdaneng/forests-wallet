<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px 20px;background:var(--surface-app);font-family:var(--font-text)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);font-family:var(--font-rounded)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Card, Badge, Tag, CATEGORIES } = window.ForrestSWalletDesignSystem_2e3ae3;

function Demo(){return(<div className="col">

    <Button size="child" tone="accent">大按钮</Button>
    <Button size="parent">中按钮</Button>
    <Button size="small" tone="quiet">小</Button>
    <IconButton icon="chevron-left" label="返回"/>
    <IconButton icon="plus" label="记一笔" tone="accent"/>

  </div></div>
  <div className="row" style={{alignItems:'stretch'}}>

  <div className="row">
    <Badge tone="in" icon="arrow-down-left">加进来了</Badge>
    <Badge tone="out" icon="arrow-up-right">花掉了</Badge>
