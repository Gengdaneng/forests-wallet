<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="爸爸的 iPhone 首页" description="Parent home: balance, the three entry actions, pending Sunday settlement, goal, latest records." -->
<helmet><script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script><script src="./ds-base.js"></script><style>body{margin:0;background:#FBF7ED}</style></helmet>
<div style="min-height:100vh;font-family:var(--font-text);display:flex;flex-direction:column">
<div style="flex:1;overflow-y:auto;padding:20px 16px;display:grid;gap:16px;align-content:start">
<div style="display:flex;align-items:center;gap:10px">
<h1 style="flex:1;font-family:var(--font-rounded);font-weight:800;font-size:28px;color:#123329;margin:0">Forrest 的账本</h1>
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.StatusBanner" size="parent" kind="{{ trust }}" hint-size="110px,32px"></x-import>
</div>
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.BalanceHero" cents="{{ balanceCents }}" size="parent" note="1:1 无条件兑现 · 他真的有这么多" hint-size="100%,150px"></x-import>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.Button" tone="accent" icon="plus" block="{{ true }}" hint-size="100%,48px">加进来</x-import>
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.Button" tone="quiet" icon="minus" block="{{ true }}" hint-size="100%,48px">花掉了</x-import>
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.Button" tone="outline" icon="rotate-ccw" block="{{ true }}" hint-size="100%,48px">更正</x-import>
</div>
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.Card" tone="honey" hint-size="100%,110px">
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.GoalProgress" size="parent" title="{{ goalTitle }}" savedCents="{{ balanceCents }}" targetCents="{{ goalTargetCents }}" hint-size="100%,90px"></x-import>
</x-import>
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.Card" hint-size="100%,330px">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
<h2 style="flex:1;font-family:var(--font-rounded);font-weight:700;font-size:20px;color:#123329;margin:0">最近记的</h2>
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.Badge" tone="neutral" icon="lock" hint-size="80px,26px">不能删</x-import>
</div>
<sc-for list="{{ tx }}" as="t" hint-placeholder-count="4">
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.TransactionRow" size="parent" reason="{{ t.reason }}" cents="{{ t.cents }}" direction="{{ t.direction }}" date="{{ t.date }}" category="{{ t.category }}" balanceAfter="{{ t.balanceAfter }}" hint-size="100%,56px"></x-import>
</sc-for>
</x-import>
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.StatusBanner" size="parent" kind="norealmoney" hint-size="100%,32px"></x-import>
</div>
<x-import component-from-global-scope="ForrestSWalletDesignSystem_2e3ae3.TabBar" items="{{ tabs }}" active="{{ tab }}" center="add" onSelect="{{ setTab }}" hint-size="100%,68px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852},&quot;balanceYuan&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:87,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:-200,&quot;max&quot;:2000,&quot;unit&quot;:&quot;元&quot;,&quot;section&quot;:&quot;账本&quot;},&quot;goalTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;乐高赛车&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;目标&quot;},&quot;goalTargetYuan&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:400,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:10,&quot;max&quot;:2000,&quot;unit&quot;:&quot;元&quot;,&quot;section&quot;:&quot;目标&quot;},&quot;online&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;信任状态&quot;}}">
class Component extends DCLogic {
  state = { tab: 'home' };
  renderVals() {
    return {
      tabs: [
        { id: 'home', label: '首页', icon: 'wallet' },
        { id: 'board', label: '看板', icon: 'calendar-check' },
        { id: 'add', label: '记一笔', icon: 'plus' },
        { id: 'hist', label: '记录', icon: 'list' },
        { id: 'set', label: '设置', icon: 'settings' },
      ],
      tab: this.state.tab,
      setTab: (id) => this.setState({ tab: id }),
      trust: this.props.online === false ? 'failed' : 'online',
      balanceCents: (this.props.balanceYuan ?? 87) * 100,
      goalTitle: this.props.goalTitle ?? '乐高赛车',
      goalTargetCents: (this.props.goalTargetYuan ?? 400) * 100,
      tx: [
        { reason: '本周基础零花钱', cents: 1000, direction: 'in', date: '10月5日', balanceAfter: 8700 },
        { reason: '帮忙搬水', cents: 200, direction: 'in', date: '10月4日', balanceAfter: 7700 },
        { reason: '买冰淇淋', cents: 1500, direction: 'out', date: '10月3日', category: 'food', balanceAfter: 7500 },
        { reason: '更正：记错了', cents: 300, direction: 'fix', date: '10月2日', balanceAfter: 9000 },
      ],
    };
  }
}
</script>
</body>
</html>
